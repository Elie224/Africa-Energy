name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: backend
        run: npm test
      - name: Boot smoke test
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-tres-long-pour-smoke-test-min-48-chars-aaa
          NODE_ENV: production
          PORT: '4000'
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          if curl -fsS http://localhost:4000/api/health; then
            kill $SERVER_PID 2>/dev/null || true
            echo "OK health"
          else
            kill $SERVER_PID 2>/dev/null || true
            echo "FAIL health"
            exit 1
          fi

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
